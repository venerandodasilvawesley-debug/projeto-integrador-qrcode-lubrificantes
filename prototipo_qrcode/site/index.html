<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#123a5c">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icone.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="apple-mobile-web-app-title" content="Lubrificação">
<title>Ficha de lubrificação</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  background:#eef1f4;color:#14202b;font-size:17px;line-height:1.4}
main{max-width:560px;margin:0 auto;padding:12px 14px 40px}
header{background:#123a5c;color:#fff;padding:14px}
header div{max-width:560px;margin:0 auto}
header b{font-size:1.5rem;letter-spacing:.5px}
header span{display:block;opacity:.9;font-size:.95rem}
#offline{display:none;background:#5b6b7a;color:#fff;text-align:center;font-weight:700;
  font-size:.9rem;padding:6px}
.cartao{background:#fff;border-radius:12px;padding:14px;margin-top:12px;
  box-shadow:0 1px 3px rgba(0,0,0,.12)}
a.cartao{display:block;text-decoration:none;color:inherit}
.rotulo{font-size:.78rem;font-weight:700;text-transform:uppercase;letter-spacing:.6px;color:#5b6b7a}
.grande{font-size:1.75rem;font-weight:800;line-height:1.15;margin:2px 0 4px}
.duplo{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}
.alerta{background:#fff3cd;border-left:6px solid #e0a100}
.alerta ul{margin:6px 0 0;padding-left:20px}
.alerta li{margin:3px 0;font-weight:600}
.ok{background:#d9f2e1;border-left:6px solid #1c8a45;font-weight:700}
.erro{background:#fbdcdc;border-left:6px solid #c22525;font-weight:700}
details{margin-top:12px;background:#fff;border-radius:12px;padding:12px 14px;
  box-shadow:0 1px 3px rgba(0,0,0,.12)}
summary{font-weight:700;cursor:pointer}
dl{margin:8px 0 0}dt{font-weight:700;margin-top:8px}dd{margin:0}
h2{font-size:1.15rem;margin:0 0 10px}
label{display:block;font-weight:600;margin-top:12px}
input[type=text]{width:100%;font-size:1.15rem;padding:12px;margin-top:4px;
  border:2px solid #b8c4cf;border-radius:10px}
.tipos{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:6px}
.tipos label{margin:0}
.tipos input{position:absolute;opacity:0}
.tipos span{display:block;text-align:center;padding:14px 4px;border:2px solid #b8c4cf;
  border-radius:10px;font-weight:700;background:#fff}
.tipos input:checked+span{background:#123a5c;border-color:#123a5c;color:#fff}
.tipos input:focus-visible+span{outline:3px solid #e0a100}
.confirma{display:flex;gap:12px;align-items:center;background:#eef1f4;border-radius:10px;
  padding:12px;font-weight:700}
.confirma input{width:28px;height:28px;flex:none}
button.salvar{width:100%;margin-top:16px;padding:16px;font-size:1.25rem;font-weight:800;color:#fff;
  background:#1c8a45;border:0;border-radius:12px}
#aviso-temp{display:none;color:#c22525;font-weight:700;margin-top:6px}
table{width:100%;border-collapse:collapse;font-size:.9rem;margin-top:8px}
td,th{text-align:left;padding:6px 4px;border-bottom:1px solid #dde3e9;vertical-align:top}
a,button.link{color:#123a5c}
button.link{background:none;border:0;padding:0;font:inherit;text-decoration:underline;cursor:pointer}
.rodape{margin-top:18px;font-size:.85rem;text-align:center}
#estado-offline{max-width:560px;margin:0 auto 24px;padding:0 14px;color:#3d4c5a}
#estado-offline b.pronto{color:#14602f}#estado-offline b.salvando{color:#8a6300}
/* abas: Lubrificação | Inspeção */
.abas{position:sticky;top:0;z-index:5;background:#123a5c;padding:0 14px 10px}
.abas div{max-width:560px;margin:0 auto;display:grid;grid-template-columns:1fr 1fr;gap:8px}
.abas button{font:inherit;font-weight:800;font-size:1.05rem;padding:12px 6px;border:2px solid #fff;
  border-radius:10px;background:transparent;color:#fff;cursor:pointer;line-height:1.15}
.abas button small{display:block;font-weight:600;font-size:.78rem;opacity:.85}
.abas button[aria-selected=true]{background:#fff;color:#123a5c}
.abas button:focus-visible{outline:3px solid #e0a100}
main.larga,.larga .abas div{max-width:1180px}
.larga header div{max-width:1180px}
/* aba de inspeção */
.insp-grade{display:grid;gap:0 16px;grid-template-columns:minmax(0,1fr)}
@media (min-width:900px){
  .insp-grade{grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);align-items:start}
  /* fixo ao rolar; se não couber na tela, rola por dentro (para alcançar a ficha da peça) */
  .insp-3d{position:sticky;top:76px;max-height:calc(100vh - 88px);overflow-y:auto;overscroll-behavior:contain}
}
.visor{position:relative;height:min(80vw,460px);min-height:260px;margin-top:8px;border-radius:10px;overflow:hidden;
  background:linear-gradient(#f5f8fb,#d9e2ea);touch-action:none}
.visor canvas{display:block;width:100%;height:100%}
.visor-msg{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;
  padding:20px;color:#5b6b7a;font-weight:600}
.baloes{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.balao{position:absolute;left:0;top:0;width:26px;height:26px;padding:0;border-radius:50%;border:2px solid #123a5c;
  background:#fff;color:#123a5c;font:700 12px/22px system-ui,sans-serif;text-align:center;pointer-events:auto;cursor:pointer}
.chamadas{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.chamadas line{stroke:#123a5c;stroke-width:1.5}.chamadas circle{fill:#123a5c}
.balao.ativo{background:#e0a100;border-color:#7a5600;color:#14202b}
.balao.apagado{opacity:.35}
.visor-ctrl{margin-top:10px}
.faixa{display:flex;align-items:center;gap:8px;margin:0;font-size:.85rem;font-weight:600}
.faixa input{flex:1;min-width:0;height:28px}
.botoes{display:grid;grid-template-columns:repeat(auto-fit,minmax(96px,1fr));gap:6px;margin-top:8px}
.botoes button,.nav button{font:inherit;font-weight:700;font-size:.9rem;padding:10px 4px;border-radius:10px;
  border:2px solid #123a5c;background:#fff;color:#123a5c;cursor:pointer}
.botoes button[aria-pressed=true]{background:#123a5c;color:#fff}
.info-peca{margin-top:10px;background:#eef1f4;border-radius:10px;padding:10px;font-size:.92rem}
.legenda{box-shadow:none;padding:6px 0 0;margin-top:6px}
.legenda table.bom{font-size:.88rem}.bom td:first-child{font-weight:800;width:2em}.bom button.link{text-align:left;font-weight:700}
.peca-topo{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.peca-ficha{display:grid;grid-template-columns:max-content 1fr;gap:4px 10px;margin:8px 0}
.peca-ficha dt{margin:0;font-size:.75rem;font-weight:700;text-transform:uppercase;letter-spacing:.4px;color:#5b6b7a;padding-top:2px}
@media (max-width:480px){.peca-ficha{grid-template-columns:1fr}.peca-ficha dt{padding-top:6px}}
.tags{list-style:none;margin:4px 0 8px;padding:0}.tags li{margin:3px 0;font-size:.9rem}
.tags code,.tags-col code,.tag-grande code,.dica code{font-family:ui-monospace,Menlo,Consolas,monospace;font-weight:700;background:#fff;
  border:1px solid #b8c4cf;border-radius:6px;padding:1px 6px;white-space:nowrap}
.tags li.atual code{background:#e0a100;border-color:#7a5600;color:#14202b}
.tag-grande{margin:8px 0;font-weight:700}.tag-grande code{font-size:1.15rem;background:#e0a100;border-color:#7a5600}
.tags-col{font-size:.8rem;line-height:1.9}
.cor-galao{display:flex;align-items:center;gap:8px;margin:0 0 6px}
.cor-galao i{width:34px;height:22px;border-radius:5px;border:2px solid #14202b;flex:none}
.peca-acoes{margin-top:10px;display:flex;flex-wrap:wrap;gap:8px}
.peca-acoes button.sec{background:#fff;color:#123a5c}
.peca-acoes button{font:inherit;font-weight:700;font-size:.9rem;padding:10px 14px;border-radius:10px;border:2px solid #123a5c;
  background:#123a5c;color:#fff;cursor:pointer}
.cartao-det{margin-top:12px}
.ficha dt{font-size:.8rem;color:#5b6b7a;text-transform:uppercase;letter-spacing:.4px}
.progresso .barra{height:6px;background:#dde3e9;border-radius:3px;overflow:hidden}
.progresso .barra i{display:block;height:100%;background:#123a5c}
.pontos{display:flex;flex-wrap:wrap;gap:5px;margin:8px 0 12px}
.ponto{width:34px;height:34px;border-radius:50%;border:2px solid #b8c4cf;background:#fff;font:700 .8rem system-ui,sans-serif;
  color:#14202b;cursor:pointer;padding:0}
.ponto.atual{border-color:#123a5c;box-shadow:0 0 0 3px #e0a100}
.secao-tag{display:inline-block;background:#123a5c;color:#fff;border-radius:6px;padding:3px 8px;font-size:.8rem;font-weight:700}
.dica{font-size:.92rem;color:#3d4c5a}
.ref{background:#eef1f4;border-left:6px solid #5b6b7a;border-radius:8px;padding:8px 10px;margin:8px 0 12px;font-size:.92rem}
.verificar{margin:6px 0 8px;padding-left:22px}.verificar li{margin:4px 0}
.delta{font-size:.9rem;font-weight:700;color:#5b6b7a;margin-top:4px}
.sugestao{margin-top:10px;font-weight:600}
.opcoes,.status{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin-top:6px}
.status{grid-template-columns:repeat(4,1fr)}
@media (max-width:480px){.status{grid-template-columns:1fr 1fr}}
.opcoes label,.status label{margin:0}
.opcoes input,.status input{position:absolute;opacity:0}
.opcoes span,.status span{display:flex;align-items:center;justify-content:center;min-height:52px;text-align:center;
  padding:8px 6px;border:2px solid #b8c4cf;border-radius:10px;font-weight:700;background:#fff;font-size:.95rem;cursor:pointer}
.opcoes input:checked+span{background:#123a5c;border-color:#123a5c;color:#fff}
.status input:checked+span.st-c{background:#1c8a45;border-color:#1c8a45;color:#fff}
.status input:checked+span.st-a{background:#e0a100;border-color:#e0a100;color:#14202b}
.status input:checked+span.st-nc{background:#c22525;border-color:#c22525;color:#fff}
.status input:checked+span.st-nv{background:#5b6b7a;border-color:#5b6b7a;color:#fff}
.opcoes input:focus-visible+span,.status input:focus-visible+span{outline:3px solid #e0a100}
.chip{display:inline-block;border-radius:999px;padding:1px 9px;font-size:.8rem;font-weight:700;white-space:nowrap}
.st-c.chip,.ponto.st-c{background:#d9f2e1;color:#14602f;border-color:#1c8a45}
.st-a.chip,.ponto.st-a{background:#fff3cd;color:#6b4d00;border-color:#e0a100}
.st-nc.chip,.ponto.st-nc{background:#fbdcdc;color:#8f1a1a;border-color:#c22525}
.st-nv.chip,.ponto.st-nv{background:#e3e8ed;color:#3d4c5a;border-color:#5b6b7a}
.st-falta.chip{background:#fff;color:#c22525;border:1px dashed #c22525}
.st-c-txt{color:#14602f}.st-a-txt{color:#8a6300;font-weight:700}.st-nc-txt{color:#c22525;font-weight:800}
.parecer{margin-top:12px;border-radius:10px;padding:12px;border-left:6px solid}
.parecer.st-c{background:#d9f2e1;border-color:#1c8a45}.parecer.st-a{background:#fff3cd;border-color:#e0a100}
.parecer.st-nc{background:#fbdcdc;border-color:#c22525}
/* vida útil do óleo */
.vida-barra{position:relative;height:14px;margin-top:14px;border-radius:7px;overflow:hidden;
  background:linear-gradient(90deg,#bfe6cb 0 80%,#ffe69a 80% 100%)}
.vida-barra i{display:block;height:100%;width:0;background:#1c8a45}
.vida-barra i.st-a{background:#e0a100}.vida-barra i.st-nc{background:#c22525}
.vida-escala{display:flex;justify-content:space-between;font-size:.78rem;font-weight:700;color:#5b6b7a;margin-top:2px}
.tipos span small{display:block;font-weight:600;font-size:.78rem}
#vida-status b.fazer{display:block;margin-top:6px}
.nav{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}
.nav button{font-size:1.1rem;padding:14px}
.nav button.pri{background:#123a5c;color:#fff}
textarea{width:100%;font:inherit;padding:10px;margin-top:4px;border:2px solid #b8c4cf;border-radius:10px}
.pend{margin:6px 0;padding-left:20px}.pend li{margin:4px 0}
.etapas{margin:6px 0 0;padding-left:24px}
.rolar{overflow-x:auto}
details.insp{box-shadow:none;border:1px solid #dde3e9;padding:8px 10px;margin-top:8px}
table.resumo td:first-child{width:55%}
table.resumo button.link{text-align:left}
.cartao details{box-shadow:none;padding:6px 0;margin-top:6px}
#i-msg,#i-checklist,#i-visor,#i-info{scroll-margin-top:84px}
@media (min-width:900px){#i-visor,#i-info{scroll-margin-top:12px}}
/* tela de escolha: primeira tela depois de ler o QR Code */
#escolha{display:none}
.escolhendo #escolha{display:flex;flex-direction:column;justify-content:center;min-height:100vh;min-height:100dvh;
  padding:24px 16px;color:#fff;
  background:linear-gradient(rgba(10,30,50,.35),rgba(10,30,50,.55)),#123a5c url(/fundo.jpg) center/cover no-repeat}
.escolhendo header,.escolhendo .abas,.escolhendo main{display:none}
#escolha>div{width:100%;max-width:720px;margin:0 auto}
#escolha h1{margin:0;font-size:2.4rem;letter-spacing:.5px;line-height:1.1;text-shadow:0 2px 8px rgba(0,0,0,.6)}
#escolha p{margin:6px 0 22px;font-size:1.1rem;text-shadow:0 1px 6px rgba(0,0,0,.7)}
.escolha-botoes{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:480px){.escolha-botoes{grid-template-columns:1fr}}
.escolha-botoes a{display:block;text-align:center;text-decoration:none;font-weight:800;font-size:1.5rem;line-height:1.15;
  padding:26px 10px;border:3px solid #fff;border-radius:16px;background:rgba(18,58,92,.88);color:#fff;
  box-shadow:0 4px 14px rgba(0,0,0,.35)}
.escolha-botoes a:first-child{background:#fff;color:#123a5c}
.escolha-botoes a small{display:block;font-weight:600;font-size:1rem;opacity:.9}
.escolha-botoes a:focus-visible{outline:3px solid #e0a100}
a.voltar{float:right;margin-left:10px;color:#fff;font-weight:700;font-size:.9rem;text-decoration:none;
  border:2px solid rgba(255,255,255,.7);border-radius:8px;padding:5px 10px}
</style>
</head>
<body>
<div id="offline">Sem internet – a ficha continua funcionando</div>
<div id="app"><main><div class="cartao">Carregando…</div></main></div>
<p id="estado-offline" class="rodape"></p>
<script src="/inspecao.js"></script>

<script>
(function () {
  "use strict";
  var TIPOS = ["Inspeção", "Complemento", "Troca"];
  var CHAVE = "registros_lubrificacao";
  var app = document.getElementById("app");

  function esc(v) {
    return String(v == null ? "" : v).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  // 30 -> "30"; 30.5 -> "30,5"
  function fmt(n) { return n == null ? "" : String(n).replace(".", ","); }
  // 15000 -> "15.000"
  function milhar(n) { return String(Math.round(n)).replace(/\B(?=(\d{3})+$)/g, "."); }
  // "30", "30,5" ou "" -> número (ou null)
  function numero(t) {
    t = String(t || "").trim().replace(",", ".");
    if (!t || isNaN(Number(t))) return null;
    return Number(t);
  }

  // Os registros ficam guardados no próprio aparelho (funciona sem internet).
  function lerRegistros() {
    try { return JSON.parse(localStorage.getItem(CHAVE)) || []; } catch (e) { return []; }
  }
  function gravarRegistros(lista) { localStorage.setItem(CHAVE, JSON.stringify(lista)); }

  function agora() {
    var d = new Date();
    function p(n) { return String(n).padStart(2, "0"); }
    return p(d.getDate()) + "/" + p(d.getMonth() + 1) + "/" + d.getFullYear() + " " +
      p(d.getHours()) + ":" + p(d.getMinutes()) + ":" + p(d.getSeconds());
  }

  function baixarCsv() {
    if (!lerRegistros().length) return alert("Ainda não há registros neste aparelho.");
    var linhas = [["codigo", "data_hora", "tipo", "quantidade_ml", "temperatura_c",
      "responsavel", "observacao", "horas_oleo", "limite_oleo_h"]];
    lerRegistros().forEach(function (r) {
      linhas.push([r.codigo, r.data_hora, r.tipo, fmt(r.quantidade_ml), fmt(r.temperatura_c),
        r.responsavel, r.observacao, r.horas_oleo, r.limite_oleo_h]);
    });
    var csv = "﻿" + linhas.map(function (l) {
      return l.map(function (c) { return '"' + String(c == null ? "" : c).replace(/"/g, '""') + '"'; }).join(";");
    }).join("\r\n");
    var a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([csv], { type: "text/csv;charset=utf-8" }));
    a.download = "registros_lubrificacao.csv";
    a.click();
  }

  function cabecalho(titulo, sub) {
    return '<header><div><b>' + esc(titulo) + '</b><span>' + esc(sub) + '</span></div></header>';
  }

  function telaInicial(equipamentos) {
    var itens = Object.keys(equipamentos).map(function (c) {
      var e = equipamentos[c];
      return '<a class="cartao" href="/e/' + esc(c) + '"><div class="rotulo">' + esc(c) +
        '</div><b>' + esc(e.nome) + '</b><br><span>' + esc(e.modelo) + '</span></a>';
    }).join("");
    app.innerHTML = cabecalho("Fichas de lubrificação",
      "Projeto Integrador · Técnico em Mecânica · SENAI Três Lagoas") +
      '<main>' + itens + '<p class="rodape"><button class="link" id="csv">' +
      'Baixar os registros deste aparelho (CSV)</button></p></main>';
    document.getElementById("csv").onclick = baixarCsv;
  }

  function telaNaoEncontrado() {
    app.innerHTML = '<main><div class="cartao erro">Equipamento não encontrado.</div>' +
      '<p class="rodape"><a href="/">Início</a></p></main>';
  }

  function linhasHistorico(codigo) {
    var linhas = lerRegistros().filter(function (r) { return r.codigo === codigo; })
      .slice(-10).reverse().map(function (r) {
        return '<tr><td>' + esc(r.data_hora) + '</td><td>' + esc(r.tipo) + '<br>' +
          fmt(r.quantidade_ml) + ' mL' +
          (r.temperatura_c != null ? ' · ' + fmt(r.temperatura_c) + ' °C' : '') +
          (r.horas_oleo != null ? '<br>Óleo com ' + milhar(r.horas_oleo) + ' h' : '') +
          '</td><td>' + esc(r.responsavel) +
          (r.observacao ? '<br><small>' + esc(r.observacao) + '</small>' : '') + '</td></tr>';
      }).join("");
    return linhas || '<tr><td colspan="3">Nenhum registro neste aparelho.</td></tr>';
  }

  // O QR Code abre primeiro a tela de escolha (Lubrificação ou Inspeção); depois, as abas trocam de página.
  function prepararAbas(codigo, e) {
    var inspecao = window.Inspecao.montar(document.getElementById("painel-inspecao"), codigo, e);
    var nomes = ["lubrificacao", "inspecao"];
    function daHash() { return nomes.indexOf(location.hash.slice(1)) < 0 ? "" : location.hash.slice(1); }
    function mostrar(nome) {
      document.body.classList.toggle("escolhendo", !nome);
      if (!nome) { document.title = codigo; return; }
      nomes.forEach(function (n) {
        document.getElementById("painel-" + n).hidden = n !== nome;
        document.getElementById("aba-" + n).setAttribute("aria-selected", String(n === nome));
      });
      app.classList.toggle("larga", nome === "inspecao");
      document.querySelector("main").classList.toggle("larga", nome === "inspecao");
      document.title = codigo + (nome === "inspecao" ? " – inspeção" : " – ficha de lubrificação");
      if (nome === "inspecao") inspecao.mostrar();
    }
    nomes.forEach(function (n) {
      document.getElementById("aba-" + n).onclick = function () {
        if (location.hash !== "#" + n) history.replaceState(null, "", "#" + n);
        mostrar(n);
        window.scrollTo(0, 0);
      };
    });
    window.addEventListener("hashchange", function () { mostrar(daHash()); window.scrollTo(0, 0); });
    mostrar(daHash());
  }

  function telaFicha(codigo, e) {
    document.title = codigo + " – ficha de lubrificação";
    var tipos = TIPOS.map(function (t, i) {
      return '<label><input type="radio" name="tipo" value="' + esc(t) + '"' +
        (i === 0 ? " checked" : "") + '><span>' + esc(t) + '</span></label>';
    }).join("");
    var alertas = e.alertas.map(function (a) { return '<li>' + esc(a) + '</li>'; }).join("");

    var temInspecao = !!(e.inspecao && window.Inspecao);
    var abas = temInspecao ? '<nav class="abas" role="tablist"><div>' +
      '<button type="button" role="tab" id="aba-lubrificacao" aria-controls="painel-lubrificacao">Lubrificação<small>ficha e registro</small></button>' +
      '<button type="button" role="tab" id="aba-inspecao" aria-controls="painel-inspecao">Inspeção<small>modelo 3D e checklist</small></button>' +
      '</div></nav>' : '';
    var escolha = temInspecao ? '<div id="escolha"><div><h1>' + esc(codigo) + '</h1><p>' +
      esc(e.nome + " · posição " + e.posicao) + '</p><nav class="escolha-botoes">' +
      '<a href="#lubrificacao">Lubrificação<small>ficha e registro</small></a>' +
      '<a href="#inspecao">Inspeção<small>modelo 3D e checklist</small></a>' +
      '</nav></div></div>' : '';
    app.innerHTML = escolha + cabecalho(codigo, e.nome + " · posição " + e.posicao) + abas + '<main>' +
      '<div id="painel-lubrificacao" role="tabpanel">' +
      '<div id="mensagem"></div>' +
      (e.vida_util_oleo ? '<section class="cartao" id="vida">' +
        '<div class="rotulo">Vida útil do óleo</div>' +
        '<label style="margin-top:6px">Horas trabalhadas desde a última troca (horímetro)' +
          '<input type="text" inputmode="numeric" id="horas-oleo" maxlength="7"></label>' +
        '<p class="dica">Preenchido sozinho: a cada inspeção com horímetro, as horas rodadas desde a inspeção anterior são somadas aqui.</p>' +
        '<label>Temperatura de trabalho do óleo</label>' +
        '<div class="tipos">' + e.vida_util_oleo.map(function (v) {
          return '<label><input type="radio" name="limite-oleo" value="' + v.horas + '"><span>' +
            (v.temp_c === e.vida_util_oleo[0].temp_c ? 'até ' : '') + v.temp_c + ' °C<small>' + milhar(v.horas) + ' h</small></span></label>';
        }).join("") + '</div>' +
        '<div class="vida-barra"><i id="vida-fill"></i></div>' +
        '<div class="vida-escala"><span>0 h</span><span id="vida-80"></span><span id="vida-100"></span></div>' +
        '<div id="vida-status"></div>' +
      '</section>' : '') +
      '<section class="cartao">' +
        '<div class="rotulo">Lubrificante</div>' +
        '<div class="grande">' + esc(e.lubrificante) + '</div>' +
        '<div>Padrão de fábrica: <b>' + esc(e.padrao_fabrica) + '</b></div>' +
        // tag do óleo no mesmo formato dos tags das peças (aba Inspeção): código do equipamento + código do item
        // cada óleo tem uma cor: a mesma do galão no almoxarifado
        (e.tag_oleo ? '<div class="ref" style="margin-bottom:0' + (e.cor_oleo ? ';border-left-color:' + esc(e.cor_oleo.hex) : '') + '">' +
          '<span class="rotulo">Código para pedir no almoxarifado</span>' +
          '<div class="tag-grande">Tag <code>' + esc(codigo + "-" + e.tag_oleo) + '</code></div>' +
          (e.cor_oleo ? '<div class="cor-galao"><i style="background:' + esc(e.cor_oleo.hex) + '"></i>Cor do galão: <b>' +
            esc(e.cor_oleo.nome.toUpperCase()) + '</b></div>' : '') +
          esc(e.padrao_fabrica + " · " + e.viscosidade + " · " + fmt(e.volume_ml) + " mL por troca") + '</div>' : '') +
        '<div class="duplo">' +
          '<div><div class="rotulo">Viscosidade</div><div class="grande">' + esc(e.viscosidade) + '</div></div>' +
          '<div><div class="rotulo">Volume (' + esc(e.posicao) + ')</div><div class="grande">' +
            fmt(e.volume_ml) + ' mL</div></div>' +
        '</div>' +
        '<div class="rotulo" style="margin-top:12px">Enchimento, dreno e nível</div>' +
        '<div>' + esc(e.pontos) + '</div>' +
      '</section>' +
      '<section class="cartao alerta"><div class="rotulo">Segurança</div><ul>' + alertas +
        '<li>EPIs: ' + esc(e.epis) + '.</li></ul></section>' +
      '<details><summary>Mais informações</summary><dl>' +
        '<dt>Modelo</dt><dd>' + esc(e.modelo) + '</dd>' +
        '<dt>Óleos equivalentes (mesma base)</dt><dd>' + esc(e.equivalentes.join("; ")) + '</dd>' +
        '<dt>Volume por posição de trabalho</dt><dd>' + esc(e.volumes_por_posicao) + '</dd>' +
        '<dt>Periodicidade</dt><dd>' + esc(e.periodicidade) + '</dd>' +
        '<dt>Temperatura</dt><dd>' + esc(e.aviso_temperatura) + '</dd>' +
        '<dt>Descarte</dt><dd>' + esc(e.descarte) + '</dd>' +
      '</dl></details>' +
      '<form class="cartao" id="registro" novalidate>' +
        '<h2>Registrar intervenção</h2>' +
        '<div class="tipos">' + tipos + '</div>' +
        '<label id="campo-quantidade">Quantidade aplicada (mL)' +
          '<input type="text" inputmode="decimal" id="quantidade"></label>' +
        '<label>Temperatura da carcaça (°C) – opcional' +
          '<input type="text" inputmode="decimal" id="temperatura"></label>' +
        '<div id="aviso-temp">' + esc(e.aviso_temperatura) + '</div>' +
        '<label>Responsável<input type="text" id="responsavel" maxlength="60" autocomplete="name"></label>' +
        '<label>Observação – opcional<input type="text" id="observacao" maxlength="200"></label>' +
        '<label class="confirma"><input type="checkbox" id="confirmado">' +
          'Equipamento bloqueado (LOTO) e bocal limpo</label>' +
        '<button type="submit" class="salvar">Salvar registro</button>' +
      '</form>' +
      '<details><summary>Histórico (últimos 10 registros)</summary>' +
        '<table><thead><tr><th>Data</th><th>Intervenção</th><th>Responsável</th></tr></thead>' +
        '<tbody id="historico">' + linhasHistorico(codigo) + '</tbody></table></details>' +
      '<p class="rodape"><a href="/etiqueta-' + esc(codigo) + '.html">Etiqueta com QR Code</a> · ' +
        '<button class="link" id="csv">Registros deste aparelho (CSV)</button> · ' +
        '<a href="/">Todas as fichas</a></p></div>' +
      '<div id="painel-inspecao" role="tabpanel" hidden></div></main>';
    if (temInspecao) {
      document.querySelector("header div").insertAdjacentHTML("afterbegin", '<a class="voltar" href="#">‹ Opções</a>');
      prepararAbas(codigo, e);
    }

    var qtd = document.getElementById("quantidade");
    var campoQtd = document.getElementById("campo-quantidade");
    var temp = document.getElementById("temperatura");
    var avisoTemp = document.getElementById("aviso-temp");
    var resp = document.getElementById("responsavel");
    var obs = document.getElementById("observacao");
    var conf = document.getElementById("confirmado");
    var msg = document.getElementById("mensagem");

    // o nome do responsável fica memorizado no aparelho
    try { resp.value = localStorage.getItem("responsavel") || ""; } catch (err) {}

    // Vida útil do óleo: verde até 80 % do limite, amarelo nos últimos 20 %, vermelho depois do limite.
    var vida = { horas: null, limite: null };
    var horasEl = document.getElementById("horas-oleo");
    function atualizarVida() {
      var st = document.getElementById("vida-status"), fill = document.getElementById("vida-fill");
      var lim = vida.limite, h = vida.horas;
      document.getElementById("vida-80").textContent = "80 % = " + milhar(lim * 0.8) + " h";
      document.getElementById("vida-100").textContent = "limite " + milhar(lim) + " h";
      if (h == null) {
        fill.style.width = "0";
        st.innerHTML = '<div class="parecer st-nv" style="background:#e3e8ed;border-color:#5b6b7a">' +
          'Informe as horas do horímetro para ver a situação do óleo.</div>';
        return;
      }
      var pct = Math.round(h / lim * 100), classe, titulo, fazer;
      var oleo = fmt(e.volume_ml) + " mL de " + e.padrao_fabrica +
        (e.tag_oleo ? " (pedir no almoxarifado pelo tag " + codigo + "-" + e.tag_oleo +
          (e.cor_oleo ? ", galão de cor " + e.cor_oleo.nome.toLowerCase() : "") + ")" : "");
      if (h > lim) {
        classe = "st-nc";
        titulo = "VERMELHO – limite ultrapassado em " + milhar(h - lim) + " h (" + pct + " % da vida útil).";
        fazer = "Trocar o óleo agora: parar e bloquear o equipamento (LOTO), drenar o óleo usado e destinar ao rerrefino, " +
          "reabastecer com " + oleo + " e registrar a intervenção como Troca.";
      } else if (h > lim * 0.8) {
        classe = "st-a";
        titulo = "AMARELO – últimos 20 % da vida útil (" + pct + " %). Faltam " + milhar(lim - h) + " h para o limite.";
        fazer = "Programar a troca: separar " + oleo + " (ou equivalente de mesma base), agendar a parada com bloqueio (LOTO) " +
          "e trocar antes de " + milhar(lim) + " h.";
      } else {
        classe = "st-c";
        titulo = "VERDE – óleo dentro da vida útil (" + pct + " %). Faltam " + milhar(lim * 0.8 - h) + " h para a faixa de atenção.";
        fazer = "Manter a inspeção de rotina: nível, vazamentos e temperatura da carcaça.";
      }
      fill.className = classe;
      fill.style.width = Math.min(100, pct) + "%";
      st.innerHTML = '<div class="parecer ' + classe + '"><b>' + esc(titulo) + '</b>' +
        '<b class="fazer">O que fazer:</b>' + esc(fazer) + '</div>';
    }
    function guardarVida() {
      try { localStorage.setItem("vida_oleo_" + codigo, JSON.stringify(vida)); } catch (err) {}
    }
    if (horasEl) {
      try { vida = JSON.parse(localStorage.getItem("vida_oleo_" + codigo)) || vida; } catch (err) {}
      var limites = e.vida_util_oleo.map(function (v) { return v.horas; });
      if (limites.indexOf(vida.limite) < 0) vida.limite = limites[0];
      horasEl.value = vida.horas == null ? "" : milhar(vida.horas);
      document.querySelectorAll("input[name=limite-oleo]").forEach(function (r) {
        r.checked = Number(r.value) === vida.limite;
        r.addEventListener("change", function () { vida.limite = Number(r.value); guardarVida(); atualizarVida(); });
      });
      horasEl.addEventListener("input", function () {
        var d = horasEl.value.replace(/\D/g, "");
        vida.horas = d ? Number(d) : null;
        guardarVida(); atualizarVida();
      });
      atualizarVida();
      // a aba Inspeção soma as horas rodadas e avisa por este evento
      window.addEventListener("vida-oleo", function () {
        try { vida = JSON.parse(localStorage.getItem("vida_oleo_" + codigo)) || vida; } catch (err) {}
        horasEl.value = vida.horas == null ? "" : milhar(vida.horas);
        atualizarVida();
      });
    }

    function tipoAtual() { return document.querySelector("input[name=tipo]:checked").value; }
    function ajustarTipo() {
      var tipo = tipoAtual();
      campoQtd.style.display = tipo === "Inspeção" ? "none" : "block";
      qtd.value = tipo === "Inspeção" ? "0" : (tipo === "Troca" ? fmt(e.volume_ml) : "");
    }
    document.querySelectorAll("input[name=tipo]").forEach(function (r) {
      r.addEventListener("change", ajustarTipo);
    });
    ajustarTipo();

    temp.addEventListener("input", function () {
      var v = numero(temp.value);
      avisoTemp.style.display = v != null && v > e.limite_carcaca_c ? "block" : "none";
    });

    function avisar(classe, texto) {
      msg.innerHTML = '<div class="cartao ' + classe + '">' + esc(texto) + '</div>';
      window.scrollTo(0, 0);
    }

    document.getElementById("csv").onclick = baixarCsv;
    document.getElementById("registro").addEventListener("submit", function (ev) {
      ev.preventDefault();
      var tipo = tipoAtual();
      var quantidade = tipo === "Inspeção" ? 0 : numero(qtd.value);
      var temperatura = numero(temp.value);
      var responsavel = resp.value.trim();

      if (!responsavel) return avisar("erro", "Informe o responsável.");
      if (!conf.checked) return avisar("erro", "Confirme o bloqueio (LOTO) e a limpeza do bocal.");
      if (quantidade == null || quantidade < 0 || quantidade > 1000)
        return avisar("erro", "Informe a quantidade aplicada, em mL.");
      if (temp.value.trim() && (temperatura == null || temperatura < -20 || temperatura > 200))
        return avisar("erro", "Temperatura inválida.");

      var lista = lerRegistros();
      lista.push({ codigo: codigo, data_hora: agora(), tipo: tipo, quantidade_ml: quantidade,
        temperatura_c: temperatura, responsavel: responsavel, observacao: obs.value.trim(),
        horas_oleo: horasEl ? vida.horas : null, limite_oleo_h: horasEl ? vida.limite : null });
      try {
        gravarRegistros(lista);
        localStorage.setItem("responsavel", responsavel);
      } catch (err) {
        return avisar("erro", "Não foi possível salvar neste aparelho.");
      }
      document.getElementById("historico").innerHTML = linhasHistorico(codigo);
      // óleo novo: a contagem de horas recomeça
      if (horasEl && tipo === "Troca") { vida.horas = 0; horasEl.value = "0"; guardarVida(); atualizarVida(); }
      temp.value = ""; obs.value = ""; conf.checked = false;
      avisoTemp.style.display = "none";
      avisar("ok", "Registro salvo neste aparelho.");
    });
  }

  function iniciar(equipamentos) {
    var m = location.pathname.match(/^\/e\/([A-Za-z0-9-]{1,20})\/?$/);
    if (!m) return telaInicial(equipamentos);
    var codigo = m[1].toUpperCase();
    if (!Object.prototype.hasOwnProperty.call(equipamentos, codigo)) return telaNaoEncontrado();
    telaFicha(codigo, equipamentos[codigo]);
  }

  var faixa = document.getElementById("offline");
  function atualizarRede() { faixa.style.display = navigator.onLine ? "none" : "block"; }
  window.addEventListener("online", atualizarRede);
  window.addEventListener("offline", atualizarRede);
  atualizarRede();

  // Mostra se a ficha já está salva no aparelho para abrir pelo QR Code sem internet.
  var estado = document.getElementById("estado-offline");
  var ehIos = /iPhone|iPad|iPod/.test(navigator.userAgent) ||
    (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
  var dicaIos = ehIos ? '<br>No iPhone o QR Code abre no <b>Safari</b>: abra a ficha uma vez pelo Safari com internet. ' +
    'Se o aparelho ficar muitos dias sem abrir a ficha, o iPhone pode apagar a cópia; basta abrir de novo com internet.' : '';
  function conferirOffline(tentativa) {
    if (!("caches" in window)) return;
    var busca = { ignoreVary: true, ignoreSearch: true };
    Promise.all(["/", "/equipamentos.json", "/inspecao.js"].map(function (a) { return caches.match(a, busca); }))
      .then(function (r) {
        var ok = r.every(Boolean);
        estado.innerHTML = (ok ? '<b class="pronto">✓ Ficha salva neste aparelho: abre pelo QR Code mesmo sem internet.</b>'
          : '<b class="salvando">Salvando a ficha para uso sem internet… mantenha a internet ligada.</b>') + dicaIos;
        if (!ok && tentativa < 20) setTimeout(function () { conferirOffline(tentativa + 1); }, 1500);
      }).catch(function () {});
  }
  if ("serviceWorker" in navigator) {
    navigator.serviceWorker.register("/sw.js").catch(function () {});
    conferirOffline(0);
    // pede ao navegador para não apagar a cópia salva (Safari 17+, Chrome)
    if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(function () {});
  } else {
    estado.textContent = "Este navegador não guarda a ficha para uso sem internet.";
  }

  fetch("/equipamentos.json").then(function (r) { return r.json(); }).then(iniciar)
    .catch(function () {
      app.innerHTML = '<main><div class="cartao erro">Não foi possível carregar a ficha. ' +
        'Abra esta página uma vez com internet para que ela fique salva no aparelho.</div></main>';
    });
})();
</script>
</body>
</html>
